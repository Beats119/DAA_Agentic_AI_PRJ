[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autograder"
version = "0.1.0"
description = "Agentic evaluation platform for student-submitted C programs (local-only, Ollama-powered)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "jinja2",
    "pymupdf",
    "httpx",
    "pyyaml",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["autograder*"]

# Templates and static assets live inside the autograder.app package
# directory but are not Python modules — ship them as package data so a
# non-editable install can still render pages (D23).
[tool.setuptools.package-data]
"autograder.app" = ["templates/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Basic ruleset only (pyflakes + the pycodestyle errors that matter).
# Pinned explicitly so lint results do not drift with ruff defaults.
select = ["E4", "E7", "E9", "F"]
