# Task -> model mapping for the Ollama gateway.
#
# BUDGET SCOPE (explicit — there is deliberately NO single global LLM
# budget; each path is bounded as stated, and the run manifest's
# diagnostics report actual per-stage usage):
#   - specification:        per-call caps only (timeout_s/max_tokens here).
#   - test_generation,
#     test_refinement,
#     oracle tier-3:        ONE shared per-run token budget — the rules
#                           file's test_generation.token_budget, enforced
#                           by a BudgetTracker checked BEFORE each round
#                           and each tier-3 call (tier-3 is opt-in via
#                           rules oracle.tier3_llm_verification).
#   - LLM analyzers
#     (code_review):        per-call caps only (this file).
#   - feedback:             bounded drafts (3) x per-call caps;
#                           feedback_check is opt-in, per-call caps.
#   Client validation re-asks are bounded at 2 per logical call
#   (ollama/client.py generate_structured).
#
# Startup probes Ollama for actual availability: a configured model that is
# not installed produces an actionable warning ("run: ollama pull <model>")
# and the dependent capability degrades explicitly. Models are never
# silently swapped and no hosted inference is ever used.
#
# Defaults target llama3.1 (fits comfortably in 16 GB RAM alongside the
# toolchain). Tune per task if a smaller/larger local model proves better.
#
# Field semantics (see autograder/app/ollama/client.py):
#   timeout_s:  IDLE timeout under streaming — the maximum seconds allowed
#               with no output chunk arriving, NOT a total-duration cap.
#               A slow-but-progressing generation is never killed for
#               taking long; only a stalled stream is.
#   num_ctx:    total context window in tokens, prompt + output combined.
#               Must exceed the largest prompt plus the output cap, or
#               Ollama silently truncates the prompt.
#   max_tokens: output-token cap, forwarded to Ollama as num_predict.

tasks:
  test_generation:
    model: "llama3.1"
    temperature: 0
    seed: 42
    timeout_s: 180
    max_tokens: 2048
    num_ctx: 8192
  test_refinement:
    model: "llama3.1"
    temperature: 0
    seed: 42
    timeout_s: 180
    max_tokens: 2048
    num_ctx: 8192
  specification:
    model: "llama3.1"
    temperature: 0
    seed: 42
    timeout_s: 180
    max_tokens: 2048
    num_ctx: 8192
  code_review:
    model: "llama3.1"
    temperature: 0
    seed: 42
    timeout_s: 120
    max_tokens: 1024
    num_ctx: 8192
  feedback:
    model: "llama3.1"
    temperature: 0
    seed: 42
    timeout_s: 120
    max_tokens: 1024
    num_ctx: 8192
  feedback_check:
    model: "llama3.1"
    temperature: 0
    seed: 42
    timeout_s: 120
    max_tokens: 1024
    num_ctx: 8192
